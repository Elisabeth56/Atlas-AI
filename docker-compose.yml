services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - atlas_postgres_data:/var/lib/postgresql/data
      # first start applies supabase/migrations and the seed (see supabase/local/init.sh)
      - ./supabase:/atlas:ro
      - ./supabase/local/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas
      DEMO_MODE: ${DEMO_MODE:-true}
      CORS_ORIGINS: "http://localhost:3000"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATAHUB_GMS_URL: ${DATAHUB_GMS_URL:-}
      DATAHUB_TOKEN: ${DATAHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/web
      args:
        # build args, not env: Next.js inlines NEXT_PUBLIC_* at build time
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_USE_BACKEND: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  atlas_postgres_data:
