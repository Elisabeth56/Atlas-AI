services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - atlas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas
      DEMO_MODE: "true"
      CORS_ORIGINS: "http://localhost:3000"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      DATAHUB_GMS_URL: ${DATAHUB_GMS_URL:-}
      DATAHUB_TOKEN: ${DATAHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Next.js inlines NEXT_PUBLIC_* vars into the client bundle at BUILD
        # time, not runtime — this must be a build arg, not an `environment:`
        # entry, or the browser bundle silently ships with no API URL and
        # the app falls back to its local mock simulation with zero
        # indication anything's wrong.
        NEXT_PUBLIC_API_URL: http://localhost:8000
        # Opt into hitting the real backend. The deployed Vercel build
        # deliberately omits this so /demo and /new use the client-side
        # simulation (Render's free tier cold-starts too slowly for a
        # reliable demo). See frontend/lib/api.ts.
        NEXT_PUBLIC_USE_BACKEND: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  atlas_postgres_data:
