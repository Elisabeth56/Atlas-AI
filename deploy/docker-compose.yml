# Production on the Oracle Always Free VM (ADR 007). The database is Supabase, so only the API and Caddy run here.
# Usage on the VM:  cd ~/atlas && docker compose pull && docker compose up -d
services:
  api:
    image: ghcr.io/elisabeth56/atlas-api:${API_TAG:-latest}
    env_file: .env
    restart: unless-stopped
    # Caddy is the only way in; the API isn't published on the host
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates survive restarts
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
