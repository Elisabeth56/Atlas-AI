name: deploy

# On each push to main that touches the API: apply migrations, then ask Render to deploy, wait for the
# new version's /health, and run a smoke run. Migrations go first so new code never meets an old schema.
# Off until the repo variable DEPLOY_ENABLED is "true"; docs/deploy.md lists the secrets.
on:
  push:
    branches: [main]
    paths: ["apps/api/**", "supabase/migrations/**", "render.yaml", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
      - name: Apply database migrations
        run: supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"

      - name: Deploy on Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait for the new version
        # /health reports the running commit, so this waits for this push, not the old instance
        run: |
          for i in $(seq 1 60); do
            commit=$(curl -fsS "${{ vars.API_URL }}/health" | python3 -c "import sys,json;print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || true)
            [ "$commit" = "${GITHUB_SHA}" ] && echo "live: $commit" && exit 0
            sleep 10
          done
          echo "the new version never came up" && exit 1

      - name: Smoke run
        env:
          API_URL: ${{ vars.API_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: pip install httpx && python scripts/smoke.py
