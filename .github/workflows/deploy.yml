name: deploy

# Builds the API image for the Oracle VM (arm64) and Render (amd64), rolls it out over SSH, then checks
# /health and runs a smoke run. Deploying is off until the repo variable DEPLOY_ENABLED is "true";
# docs/deploy.md lists the secrets it needs.
on:
  push:
    branches: [main]
    paths: ["apps/api/**", "deploy/**", "supabase/migrations/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/elisabeth56/atlas-api:latest
            ghcr.io/elisabeth56/atlas-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
      - name: Apply database migrations
        run: supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"

      - name: Roll out on the VM
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
        run: |
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          mkdir -p ~/.ssh && ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts
          scp -i key deploy/docker-compose.yml deploy/Caddyfile "$VM:~/atlas/"
          ssh -i key "$VM" "cd ~/atlas && API_TAG=${{ github.sha }} docker compose pull && API_TAG=${{ github.sha }} docker compose up -d && docker image prune -f"

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do curl -fsS "${{ vars.API_URL }}/health" && exit 0; sleep 5; done
          echo "API never became healthy" && exit 1

      - name: Smoke run
        env:
          API_URL: ${{ vars.API_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: pip install httpx && python scripts/smoke.py
