# The API on Render (ADR 007). Render builds apps/api/Dockerfile from this repo; the deploy workflow
# triggers each deploy after migrations, so autoDeploy is off. Secrets are set in the Render dashboard.
services:
  - type: web
    name: atlas-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free # sleeps after 15 idle minutes and wakes in about a minute; "starter" keeps it on (ADR 007)
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: AUTH_MODE
        value: supabase
      - key: DEMO_MODE
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: RUNS_PER_HOUR
        value: "10"
      # Supabase → Project Settings → Database → Session pooler (IPv4, keeps prepared statements).
      # Use the postgresql+asyncpg:// scheme.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      # the Vercel production URL; previews match CORS_ORIGIN_REGEX
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://atlas-ai-[a-z0-9-]+-elisabeth-nnamanis-projects\.vercel\.app
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
